  <!-- 쿼리스트링(?v=)으로 캐시 무효화: 파일명이 그대로면 브라우저가 이전 favicon을 계속 캐시해서
       내용을 바꿔도 갱신되지 않는다. 아이콘을 다시 바꿀 때는 이 버전 숫자를 올릴 것. -->

  <title>livespot_app</title>
  <link rel="manifest" href="manifest.json">

  <!--
    카카오 로그인 JS SDK (기능 9 / Q1-B).
    MapTiler와 같은 방식으로 CDN에서 싣고 dart:js로 호출한다 — Dart 패키지를 추가하지 않는다.

    ⚠️ SDK 버전 주의: 팝업 로그인(`Kakao.Auth.login`)은 v1 SDK의 API다. v2 SDK(t1.kakaocdn.net)는
       `Kakao.Auth.authorize()`(리다이렉트) 중심으로 바뀌면서 `login()`이 빠진 버전이 있다.
       아래 livespotKakaoLogin()은 `Kakao.Auth.login`이 없으면 **조용히 실패하지 않고**
       그 사실을 그대로 앱에 알린다(빈 화면 대신 원인이 보이게). 팝업이 막히면 대안은
       01_spec Q1-A(서버 주도 리다이렉트)이고, 그건 백엔드 엔드포인트 추가가 필요하다.
  -->
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
  <script>
    // Flutter(dart:js)가 부르는 진입점. 카카오 JavaScript 키는 앱이 --dart-define으로
    // 받아 인자로 넘긴다 — 이 파일에 키를 적어두지 않는다(빌드 환경마다 값이 다르다).
    //
    // 결과는 window.livespotKakaoOnSuccess / livespotKakaoOnFail 콜백으로 돌려준다
    // (Dart 쪽에서 js.context에 심어둔 함수). MapTiler의 onSpotMarkerClick과 같은 패턴이다.
    function livespotKakaoLogin(jsKey) {
      function fail(message) {
        if (window.livespotKakaoOnFail) window.livespotKakaoOnFail(String(message));
      }

      if (typeof Kakao === 'undefined') {
        fail('카카오 SDK를 불러오지 못했어요. 네트워크 연결을 확인해 주세요.');
        return;
      }
      if (!jsKey) {
        fail('카카오 JavaScript 키가 설정되지 않았어요. --dart-define=KAKAO_JS_KEY=... 로 빌드해 주세요.');
        return;
      }

      try {
        // init은 1회만. 이미 초기화됐는데 다시 부르면 예외가 난다.
        if (!Kakao.isInitialized()) Kakao.init(jsKey);
      } catch (e) {
        fail('카카오 SDK 초기화 실패: ' + e.message);
        return;
      }

      if (!Kakao.Auth || typeof Kakao.Auth.login !== 'function') {
        fail('이 카카오 SDK 버전에는 팝업 로그인(Auth.login)이 없습니다. web/index.html의 SDK 버전을 확인해 주세요.');
        return;
      }

      // 동의항목을 요청하지 않는다 — 카카오는 신원 확인 전용이다(01_spec P34~P37).
      // 닉네임은 앱에서 사용자가 직접 정하고, 프로필 사진은 받지 않는다.
      // scope 키를 다시 넣지 말 것: 콘솔에 없는 동의항목을 요청하면 카카오가
      // KOE205로 인가 요청 자체를 거부해 로그인이 전면 실패한다.
      // (SDK의 makeAuthParams()는 scope가 falsy면 파라미터를 아예 보내지 않는다.)
      Kakao.Auth.login({
        success: function (authObj) {
          var token = authObj && authObj.access_token;
          if (!token) {
            fail('카카오가 액세스 토큰을 돌려주지 않았어요.');
            return;
          }
          if (window.livespotKakaoOnSuccess) window.livespotKakaoOnSuccess(token);
        },
        fail: function (err) {
          // 사용자가 팝업을 닫은 경우도 여기로 온다 — 앱이 "취소"로 구분할 수 있게
          // 카카오가 준 error 코드를 그대로 넘긴다.
          var code = (err && (err.error || err.error_code)) || '';
          var desc = (err && (err.error_description || err.error_msg)) || '';
          fail(code + (desc ? (': ' + desc) : ''));
        },
      });
    }

    // 로그아웃 시 SDK가 들고 있는 카카오 토큰도 버린다. 우리 JWT를 지우는 것과 별개로,
    // SDK에 토큰이 남아 있으면 다음 로그인에서 팝업 없이 이전 계정으로 붙을 수 있다.
    function livespotKakaoClearSession() {
      try {
        if (typeof Kakao !== 'undefined' && Kakao.Auth && Kakao.Auth.getAccessToken()) {
          Kakao.Auth.logout();
        }
      } catch (e) {
        // 로그아웃의 본체는 우리 토큰 삭제다. SDK 정리 실패로 그걸 막지 않는다.
      }
    }
  </script>

  <!-- MapTiler SDK JS (WebGL 기반, Leaflet/iframe 미사용) -->
  <link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/latest/maptiler-sdk.css" />
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/latest/maptiler-sdk.umd.min.js"></script>
  <script>
    // ─────────────────────────────────────────────────────────────
    // MapTiler 설정 - 실제 값 입력 필요
    //   apiKey : MapTiler Cloud > Account > API Keys
    //   style  : 스타일 ID(예: "streets-v2") 또는 전체 style.json URL
    // ─────────────────────────────────────────────────────────────
    window.MAPTILER_CONFIG = {
      apiKey: 'SQrfMt5hGvcAVf4rjawN',
      style: 'https://api.maptiler.com/maps/019ffa48-24b4-7c8b-af84-8758091d2269/style.json?key=SQrfMt5hGvcAVf4rjawN',
    };

    var spotMap = null;
    // id -> { marker, el, sig }  (id 기준 diffing으로 마커 중복 생성 방지)
    var spotMarkers = {};
    // 사용자 현재 위치 핀. 관광지 마커와 달리 단 하나뿐이라 diffing 없이 위치만 갱신한다.
    var userLocationMarker = null;

    function showMapError(container, message) {
      if (!container) return;
      container.innerHTML = '<div style="color:red; padding:20px; text-align:center; background:white; height:100%; display:flex; align-items:center; justify-content:center;">' + message + '</div>';
    }

    // 지도 초기화 (Flutter에서 호출). 이미 생성됐으면 재생성하지 않음.
    function initSpotMap(container, lat, lng) {
      if (spotMap) return;

      if (!container) {
        console.error('MapTiler Error: container is null');
        return;
      }

      if (typeof maptilersdk === 'undefined') {
        showMapError(container, 'MapTiler SDK 로드 실패!<br>네트워크 연결을 확인해주세요.');
        return;
      }

      var cfg = window.MAPTILER_CONFIG || {};
      if (!cfg.apiKey || !cfg.style) {
        showMapError(container, 'MapTiler 설정이 비어 있습니다.<br>web/index.html의 MAPTILER_CONFIG에<br>apiKey와 style을 입력해주세요.');
        return;
      }

      try {
        maptilersdk.config.apiKey = cfg.apiKey;

        spotMap = new maptilersdk.Map({
          container: container,
          style: cfg.style,
          center: [lng, lat], // MapTiler/GeoJSON은 [경도, 위도] 순서
          zoom: 13,
          navigationControl: false,
          geolocateControl: false,
        });
      } catch (e) {
        spotMap = null;
        showMapError(container, 'MapTiler 초기화 에러:<br>' + e.message);
      }
    }

    // 마커 DOM 내용 렌더링 (신규 생성 / 내용 갱신 공용)
    //
    // 마커 색상은 방문 집중률 "예측"(기능 9, 한국관광공사) 기준이다 — 현장 제보 실측과는
    // 다른 지표라 별도 어휘(green/yellow/red/unknown)로 넘어온다.
    //
    // 집중률 데이터셋은 주요 관광지 위주라 TourAPI가 주는 관광지의 일부만 값을 갖는다
    // (축제·상점·조형물 등은 애초에 대상이 아님). 값 없는 마커를 초록으로 칠하면
    // "여유롭다"는 거짓 신호가 되므로, 테두리 없이(색 없음) 나머지 스타일은 동일하게 둔다
    // — 흐리게 처리하면 지도에서 존재감 자체가 사라져 탐색 경험이 나빠지기 때문이다.
    function renderMarkerContent(el, spot) {
      var level = spot.congestionLevel;
      var color = level === 'green' ? '#4CAF50' :
                  level === 'yellow' ? '#FF9800' :
                  level === 'red' ? '#F44336' : null;

      el.style.padding = '4px 8px';
      el.style.backgroundColor = 'white';
      el.style.border = color ? ('2px solid ' + color) : 'none';
      el.style.borderRadius = '8px';
      el.style.boxShadow = '0 2px 6px rgba(0,0,0,0.3)';
      el.style.fontSize = '12px';
      el.style.fontWeight = 'bold';
      el.style.color = '#212121';
      el.style.cursor = 'pointer';

      var title = spot.title || '';
      var shortTitle = title.length > 6 ? title.substring(0, 6) + '..' : title;

      // LIVE 펄스 표시는 지도 마커에서는 쓰지 않는다 — 마커 색상은 집중률 "예측"이고,
      // "최근 제보 여부(LIVE)"는 성격이 다른 실측 신호라 마커를 눌러 여는 카드에서만 보여준다.
      var innerHtml = '<div style="display:flex; align-items:center;">';
      innerHtml += '<span>' + shortTitle + '</span>';
      if (spot.onsiteCount > 0) {
        innerHtml += '<span style="margin-left:4px; font-size:10px; color:#757575;">' + spot.onsiteCount + '명</span>';
      }
      innerHtml += '</div>';

      el.innerHTML = innerHtml;
    }

    // 마커 갱신 - id 기준 diffing (변경 없는 마커는 건드리지 않음)
    function updateSpotMarkers(spotsJson) {
      if (!spotMap) return;

      var spots;
      try {
        spots = JSON.parse(spotsJson);
      } catch (e) {
        console.error('마커 데이터 파싱 실패:', e);
        return;
      }

      var seen = {};

      spots.forEach(function (spot) {
        if (spot.lat == null || spot.lng == null) return;

        var id = String(spot.id);
        seen[id] = true;

        // 값이 하나라도 바뀌었는지 판별하는 시그니처
        var sig = [spot.lat, spot.lng, spot.title, spot.congestionLevel, spot.onsiteCount].join('|');
        var existing = spotMarkers[id];

        if (existing) {
          if (existing.sig === sig) return; // 변경 없음 → 재생성/재렌더 안 함
          existing.marker.setLngLat([spot.lng, spot.lat]);
          renderMarkerContent(existing.el, spot);
          existing.sig = sig;
          return;
        }

        var el = document.createElement('div');
        renderMarkerContent(el, spot);
        el.addEventListener('click', function () {
          if (window.onSpotMarkerClick) {
            window.onSpotMarkerClick(id);
          }
        });

        var marker = new maptilersdk.Marker({ element: el, anchor: 'bottom' })
          .setLngLat([spot.lng, spot.lat])
          .addTo(spotMap);

        spotMarkers[id] = { marker: marker, el: el, sig: sig };
      });

      // 더 이상 존재하지 않는 마커 제거
      Object.keys(spotMarkers).forEach(function (id) {
        if (!seen[id]) {
          spotMarkers[id].marker.remove();
          delete spotMarkers[id];
        }
      });
    }

    // 사용자 현재 위치 핀 (Flutter에서 GPS 좌표를 얻을 때마다 호출). 방위(heading)는
    // 표시하지 않는다 — 앱 아이콘을 원형으로 담은 CSS 핀(하단이 뾰족한 물방울 모양)만 쓴다.
    // 관광지 마커와 구분되도록 primaryColor 테두리를 두른다.
    function updateUserLocationMarker(lat, lng) {
      if (!spotMap || lat == null || lng == null) return;

      if (userLocationMarker) {
        userLocationMarker.setLngLat([lng, lat]);
        return;
      }

      var el = document.createElement('div');
      el.style.width = '26px';
      el.style.height = '26px';
      // 정사각형을 45도 회전 + 좌상단 모서리만 직각으로 남겨 물방울(핀) 모양을 만드는
      // 표준 CSS 트릭. anchor: 'bottom'과 맞춰 뾰족한 꼭짓점이 실제 좌표를 가리킨다.
      el.style.transform = 'rotate(-45deg)';
      el.style.borderRadius = '50% 50% 50% 0';
      el.style.background = '#fff';
      // #1E88E5: lib/config/theme.dart의 LiveSpotTheme.primaryColor와 동일한 값을
      // 유지한다 — 이 파일은 Dart 상수를 참조할 수 없어 값을 그대로 복제했다.
      el.style.border = '2px solid #1E88E5';
      el.style.boxShadow = '0 2px 6px rgba(0,0,0,0.35)';
      el.style.display = 'flex';
      el.style.alignItems = 'center';
      el.style.justifyContent = 'center';
      el.style.overflow = 'hidden';

      var img = document.createElement('img');
      img.src = 'icons/Icon-192.png';
      img.style.width = '16px';
      img.style.height = '16px';
      img.style.borderRadius = '50%';
      img.style.objectFit = 'cover';
      // 바깥 el만 회전시키고 아이콘 자체는 반대로 되돌려 정방향으로 보이게 한다.
      img.style.transform = 'rotate(45deg)';
      el.appendChild(img);

      userLocationMarker = new maptilersdk.Marker({ element: el, anchor: 'bottom' })
        .setLngLat([lng, lat])
        .addTo(spotMap);
    }

    // 내 위치로 이동
    function panToSpotMap(lat, lng) {
      if (!spotMap) return;
      spotMap.easeTo({ center: [lng, lat] });
    }

    // 지도 탭이 숨겨져 있는 동안(크기 0) 초기화됐던 경우를 대비해
    // 탭이 다시 보일 때 컨테이너 크기를 다시 계산합니다.
    function relayoutSpotMap(lat, lng) {
      if (!spotMap) return;
      spotMap.resize();
      if (lat != null && lng != null) {
        spotMap.setCenter([lng, lat]);
      }
    }

    // 화면 종료 시 지도/마커/이벤트 정리
    function disposeSpotMap() {
      Object.keys(spotMarkers).forEach(function (id) {
        spotMarkers[id].marker.remove();
      });
      spotMarkers = {};

      if (userLocationMarker) {
        userLocationMarker.remove();
        userLocationMarker = null;
      }

      if (spotMap) {
        spotMap.remove();
        spotMap = null;
      }
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
